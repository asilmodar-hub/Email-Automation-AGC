<title>Deal Flow Outreach</title>
<script>
  // the theme before anything is drawn, so a dark screen does not flash white
  (function () {
    var pick = "system";
    try { pick = localStorage.getItem("agc-theme") || "system"; } catch (e) {}
    var dark = pick === "dark" || (pick === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="app.css">
</head>

</header>
